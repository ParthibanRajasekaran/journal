name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      PG_HOST: 127.0.0.1
      PG_PORT: "5432"
      PG_USER: postgres
    services:
      postgres:
        image: postgres:18
        # Throwaway database for CI only. Trust auth is confined to this service container.
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: journal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks needs full history

      - uses: astral-sh/setup-uv@v6
      - uses: open-policy-agent/setup-opa@v2
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tgz
          echo "$(curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt | grep linux_x64.tar.gz | cut -d' ' -f1)  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks && sudo mv gitleaks /usr/local/bin/

      - name: Install PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Create test database
        run: createdb -h 127.0.0.1 -p 5432 -U postgres journal_test || true

      - name: Sync backend dependencies (locked)
        run: cd backend && uv sync --locked

      - name: Make check
        run: make check

  # Change-set policy (bootstrap). The checker runs from a trusted checkout of the BASE commit; the pull request
  # is read as data and its code is never executed. NOT a required status until the owner enables branch
  # protection (see docs/factory/proposals/ci-policy-check.md). Requiring the name alone is insufficient: a pull
  # request can replace this job's command, so the workflow file itself needs code-owner review.
  policy-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Trusted checker (base commit)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Pull request (data only, never executed)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Change-set policy
        working-directory: trusted
        run: python3 tools/policy_check.py --repo "$GITHUB_WORKSPACE/pr" --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}"
