# OpenTelemetry Collector. Receives the API's traces, metrics and logs on the internal network,
# removes anything sensitive as a second line of defence, and forwards each signal.
# File offsets are kept in a volume, so a restart resumes where it left off instead of re-sending lines.
extensions:
  file_storage:
    directory: /var/lib/otelcol/file_storage

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
  filelog:
    include: [/var/lib/docker/containers/*/*-json.log]
    start_at: beginning
    storage: file_storage
    # Docker wraps each line in its own JSON. Unwrap it so the application's JSON is the body.
    operators:
      - type: json_parser
        parse_from: body
        parse_to: attributes
      - type: move
        from: attributes.log
        to: body

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 200
    spike_limit_mib: 50
  # Keep only the API's own JSON log lines. Access logs and database logs stay out of Loki.
  filter/api_logs:
    error_mode: propagate
    logs:
      log_record:
        - 'not IsMatch(body, "logger.{1,5}journal")'
  # Second line of defence: drop request headers and bodies even if application code adds them.
  attributes/redact:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.request.body
        action: delete
      - key: http.response.body
        action: delete
      - key: user.email
        action: delete
  # Log lines from files carry no service name, so Loki needs one to label the stream.
  resource/api_logs:
    attributes:
      - key: service.name
        value: journal-api
        action: upsert
  batch:
    timeout: 10s

exporters:
  otlphttp/jaeger:
    endpoint: http://jaeger:4318
  prometheus:
    endpoint: 0.0.0.0:8889
  otlphttp/loki:
    endpoint: http://loki:3100/otlp

service:
  extensions: [file_storage]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, batch]
      exporters: [otlphttp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, batch]
      exporters: [prometheus]
    logs:
      receivers: [filelog]
      processors: [memory_limiter, filter/api_logs, resource/api_logs, batch]
      exporters: [otlphttp/loki]
