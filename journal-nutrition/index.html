<!doctype html>

  <head>
    <script>
      // 1. Mock Vite HMR WebSocket in sandboxed iframe environment
      if (typeof window !== 'undefined' && window.WebSocket) {
        const NativeWebSocket = window.WebSocket;

        class MockHmrSocket extends EventTarget {
          constructor(url) {
            super();
            this.url = String(url);
            this.protocol = 'vite-hmr';
            this.readyState = 1; // WebSocket.OPEN
            this.onopen = null;
            this.onclose = null;
            this.onerror = null;
            this.onmessage = null;

            setTimeout(() => {
              try {
                const openEv = new Event('open');
                this.dispatchEvent(openEv);
                if (typeof this.onopen === 'function') {
                  this.onopen(openEv);
                }
              } catch (e) {}
            }, 10);
          }

          send() {}
          close() {}
        }

        window.WebSocket = function (url, protocols) {
          const isViteHmr =
            protocols === 'vite-hmr' ||
            (Array.isArray(protocols) && protocols.includes('vite-hmr')) ||
            (typeof url === 'string' && (url.includes('/@vite') || url.includes('vite-hmr')));

          if (isViteHmr) {
            return new MockHmrSocket(url);
          }

          try {
            return new NativeWebSocket(url, protocols);
          } catch (e) {
            return new NativeWebSocket(url);
          }
        };

        window.WebSocket.prototype = NativeWebSocket.prototype;
        window.WebSocket.CONNECTING = 0;
        window.WebSocket.OPEN = 1;
        window.WebSocket.CLOSING = 2;
        window.WebSocket.CLOSED = 3;
      }

      // 2. Global window.onerror suppressor
      const prevOnError = window.onerror;
      window.onerror = function(message, source, lineno, colno, error) {
        if (
          (typeof message === 'string' && (message.includes('WebSocket') || message.includes('vite') || message.includes('ws://') || message.includes('wss://'))) ||
          (error && error.message && error.message.includes('WebSocket'))
        ) {
          return true; // suppresses error in browser
        }
        if (typeof prevOnError === 'function') {
          return prevOnError.apply(this, arguments);
        }
        return false;
      };

      // 3. Error event listener
      window.addEventListener('error', function(e) {
        if (
          e &&
          ((e.message && (e.message.includes('WebSocket') || e.message.includes('ws://') || e.message.includes('wss://'))) ||
          (e.error && e.error.message && e.error.message.includes('WebSocket')))
        ) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true);

      // 4. Unhandled promise rejections
      window.addEventListener('unhandledrejection', function(e) {
        if (
          e &&
          e.reason &&
          e.reason.message &&
          (e.reason.message.includes('WebSocket') || e.reason.message.includes('ws://') || e.reason.message.includes('wss://'))
        ) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
