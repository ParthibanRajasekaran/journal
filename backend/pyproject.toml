[project]
name = "journal-api"
version = "0.1.0"
description = "Journal meal-logging API (see docs/adr/0001-backend-and-api.md)"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.3",
    "schemathesis>=4.32.7",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I",   # pycodestyle, pyflakes, isort
    "B",                  # bugbear
    "S",                  # bandit-style security rules
    "UP",                 # pyupgrade
    "SIM",                # simplifications
    "ASYNC",              # async pitfalls
    "PT",                 # pytest style
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]     # assert is expected in tests

[tool.mypy]
strict = true
files = ["app", "tests"]
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
