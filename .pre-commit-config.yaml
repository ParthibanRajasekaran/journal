# All hooks are local and use tools installed on the machine (see Makefile),
# so no hook repositories are downloaded or executed at commit time.
repos:
  - repo: local
    hooks:
      - id: guard-staged-files
        name: block archives, secrets files, and files over 1 MB
        entry: scripts/guard-staged.sh
        language: script
        pass_filenames: false
        always_run: true

      - id: gitleaks
        name: gitleaks (staged changes)
        entry: gitleaks protect --staged --redact --no-banner
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff
        name: ruff lint and format check
        entry: bash -c 'cd backend && uv run ruff check . && uv run ruff format --check .'
        language: system
        pass_filenames: false
        always_run: true

      - id: mypy
        name: mypy (strict)
        entry: bash -c 'cd backend && uv run mypy'
        language: system
        pass_filenames: false
        always_run: true

      - id: opa-check
        name: opa check
        entry: opa check policy
        language: system
        pass_filenames: false
        always_run: true
